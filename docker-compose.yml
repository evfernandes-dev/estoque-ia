services:
  api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - MAX_ITERACOES=${MAX_ITERACOES:-5}
      - API_TOKEN=${API_TOKEN:-}
