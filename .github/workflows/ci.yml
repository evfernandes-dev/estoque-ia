name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        run: pip install -e .[dev]
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Avaliacao offline
        run: python -m estoque_ia.avaliacao

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem
        run: docker build -t estoque-ia .
      - name: Subir container
        run: docker run -d --name teste -p 8000:8000 estoque-ia
      - name: Aguardar e testar endpoints
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/saude > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/saude
          curl -fsS http://127.0.0.1:8000/resumo | grep -q '"total_medicamentos":30'
      - name: Remover container
        if: always()
        run: docker rm -f teste
